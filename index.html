<!-- Tela de boas-vindas (index.html/welcome.css) -> signup.html -> login.html -->

<!DOCTYPE html>
<html lang="pt-BR">

<!-- 0 CSS imports base -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FazTchê — Boas-vindas</title>
  <!-- 1 - Css Base de Reset -->
  <link rel="stylesheet" href="css/base/reset.css">
  <link rel="stylesheet" href="css/base/tokens.css">
  <!-- 2 - Css Medidas de tela (responsividade)-->
  <link rel="stylesheet" href="css/layouts/screen.css">
  <!-- 3 - Css Componentes de Entrada-->
  <link rel="stylesheet" href="./css/components/buttons.css">
  <link rel="stylesheet" href="./css/components/forms.css">
  <link rel="stylesheet" href="./css/components/social-buttons.css">
  <!-- 4 - Css Configuração de Página-->
  <link rel="stylesheet" href="css/pages/welcome.css">
</head>

<body>

  <div class="screen welcome-screen">

      <p>
        Encontre. <br>
        Conecte,<br>

      </p>

    </div>
    <!-- 1.2 Botões de Ação -->
    <div class="welcome-actions">
      <a href="pages/authenticator/signup.html" class="btn btn-primary">
        Criar conta
      </a>
      <a href="pages/authenticator/login.html" class="btn btn-outline btn-light">
        Entrar
      </a>
    </div>

  </div>

  <script src="js/pages/welcome.js"></script>

</html>
