<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FazTchê - Buscar</title>

  <link rel="stylesheet" href="../../css/base/reset.css">
  <link rel="stylesheet" href="../../css/base/tokens.css">
  <link rel="stylesheet" href="../../css/layouts/screen.css">
  <link rel="stylesheet" href="../../css/components/bottom-nav.css">
  <link rel="stylesheet" href="../../css/pages/search.css">
</head>
<body>

  <div class="screen search-screen">

    <!-- Header: título + barra de busca + filtros -->
    <header class="search-header">

      <div class="header-top">
        <div class="search-title">
          <h1>Buscar</h1>
        </div>

        <div id="header-actions-root" data-context="app"></div>
      </div>

      <div class="search-input-wrapper">
        <input type="text" id="search-input" placeholder="O que você precisa?" autocomplete="off">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </div>

      <!-- CHIPS DE FILTRO -->
      <div class="filters-scroll">
        <div class="filter-chip select-chip">
          <select id="filter-category">
            <option value="">Categoria</option>
            <option value="Barbearia">Barbearia</option>
            <option value="Padaria">Padaria</option>
            <option value="Serviços">Serviços</option>
          </select>
        </div>

        <button class="filter-chip" id="filter-distance" data-active="false">
          Até 10 km
        </button>

        <button class="filter-chip" id="filter-rating" data-active="false">
          ★ 4,0+
        </button>

        <button class="filter-chip" id="filter-status" data-active="false">
          🟢 Disponível agora
        </button>
      </div>
    </header>

    <!-- Lista de resultados -->
    <main class="results-container" id="results-list">
      <!-- Cards injetados via JavaScript -->
    </main>

    <div id="bottom-nav-root" data-active="search" data-context="app"></div>

    <div id="profile-drawer-root"></div>

  </div>

  <!-- Componentes compartilhados (header, bottom-nav, drawer de perfil) -->
  <script src="../../js/components/header-actions.js"></script>
  <script src="../../js/components/profile-drawer.js"></script>
  <script src="../../js/components/bottom-nav.js"></script>
  <!-- Lógica específica desta página -->
  <script src="../../js/pages/search.js"></script>
</body>
</html>
