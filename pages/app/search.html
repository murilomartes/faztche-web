  <div class="screen search-screen">
    
    <!-- HEADER & BARRA DE BUSCA -->
    <header class="search-header">

      <!-- Linha superior: título "Buscar", logo central e ações (mesmo padrão do header da Início) -->
      <div class="header-top">
        <div class="search-title">
          <h1>Buscar</h1>
        </div>

        <a href="buscar.html" class="brand-logo" aria-label="Ir para a página inicial">
          <span class="brand-faz">Faz</span><span class="brand-tche">Tchê</span>
        </a>

        <div class="header-actions">
          <button class="icon-btn" aria-label="Notificações">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>

          <button class="profile-avatar-btn" id="open-profile-drawer" aria-label="Abrir opções do perfil">
            <img src="../../assets/images/avatar_placeholder.png" alt="Perfil" class="user-avatar">
          </button>
        </div>
      </div>

      <div class="search-input-wrapper">
        <input type="text" id="search-input" placeholder="O que você precisa?" autocomplete="off">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
      </div>

      <!-- CHIPS DE FILTRO -->
      <div class="filters-scroll">
        <div class="filter-chip select-chip">
          <select id="filter-category">
            <option value="">Categoria</option>
            <option value="Barbearia">Barbearia</option>
            <option value="Padaria">Padaria</option>
            <option value="Serviços">Serviços</option>
          </select>
        </div>

        <button class="filter-chip" id="filter-distance" data-active="false">
          Até 10 km
        </button>

        <button class="filter-chip" id="filter-rating" data-active="false">
          ★ 4,0+
        </button>

        <button class="filter-chip" id="filter-status" data-active="false">
          🟢 Disponível agora
        </button>
      </div>
    </header>

    <!-- LISTA DE RESULTADOS -->
    <main class="results-container" id="results-list">
