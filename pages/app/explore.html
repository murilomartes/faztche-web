<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FazTchê - Explorar</title>
  
  <link rel="stylesheet" href="../../css/base/reset.css">
  <link rel="stylesheet" href="../../css/base/tokens.css">
  <link rel="stylesheet" href="../../css/layouts/screen.css">
  <link rel="stylesheet" href="../../css/components/bottom-nav.css">
  <link rel="stylesheet" href="../../css/pages/explore.css">
</head>
<body>

  <div class="screen explore-screen">
    
    <!-- Header fixo com título e categorias -->
    <header class="explore-header">
      <h1>Explorar</h1>
      
      <div class="categories-tabs" id="explore-tabs">
        <button class="tab-chip active" data-category="para-voce">Para você</button>
        <button class="tab-chip" data-category="servicos">Serviços</button>
        <button class="tab-chip" data-category="turismo">Turismo</button>
        <button class="tab-chip" data-category="promocoes">Promoções</button>
      </div>
    </header>

    <!-- Timeline: feed vertical full-screen, estilo Reels/TikTok -->
    <main class="explore-feed" id="explore-feed">
      <!-- Posts injetados dinamicamente via js/explore.js -->
    </main>

    <div id="bottom-nav-root" data-active="explore" data-context="app"></div>

  </div>

  <script src="../../js/components/bottom-nav.js"></script>
  <script src="../../js/pages/explore.js"></script>
</body>
</html>
