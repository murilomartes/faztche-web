<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FazTchê - Início</title>

  <!-- CSS base, layout, componentes e da página -->
  <link rel="stylesheet" href="../../css/base/reset.css">
  <link rel="stylesheet" href="../../css/base/tokens.css">
  <link rel="stylesheet" href="../../css/layouts/screen.css">
  <link rel="stylesheet" href="../../css/components/bottom-nav.css">
  <link rel="stylesheet" href="../../css/pages/home.css">
</head>
<body>

  <div class="screen home-screen">

    <!-- Header: saudação/localização + componente de logo/ações -->
    <header class="home-header">
      <div class="header-top">
        <div class="user-location">
          <span class="greeting">Boa Noite, Murilo</span>
          <div class="location-tag">
            <svg width="12" height="14" viewBox="0 0 24 24" fill="var(--color-primary)"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            <small>Cachoeirinha</small>
          </div>
        </div>
        <div id="header-actions-root" data-context="app"></div>
      </div>
    </header>

    <main class="home-content">
      <!-- 2 Barra de busca -->
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="O que você precisa?">
      </div>
    
      <!-- Carrossel de categorias (filtro + botão "Ver mais") -->
      <section class="categories-scroll" id="categories-container">
        <button class="category-item active" data-category="barbearia">
          <div class="category-icon-wrapper">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/><line x1="12" y1="16" x2="12" y2="21"/></svg>
          </div>
          <span class="category-label">Barbearia</span>
        </button>
        <button class="category-item" data-category="confeitaria">
          <div class="category-icon-wrapper">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/></svg>
          </div>
          <span class="category-label">Confeitaria</span>
        </button>
        <button class="category-item" data-category="mecanica">
          <div class="category-icon-wrapper">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
          </div>
          <span class="category-label">Mecânica</span>
        </button>
        <button class="category-item" data-category="estetica">
          <div class="category-icon-wrapper">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
          </div>
          <span class="category-label">Estética</span>
        </button>
        <button class="category-item" data-category="jardinagem">
          <div class="category-icon-wrapper">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22v-9"/><path d="M12 13C7.5 13 4 9.5 4 5c4.5 0 8 3.5 8 8z"/><path d="M12 13c4.5 0 8-3.5 8-8-4.5 0-8 3.5-8 8z"/></svg>
          </div>
          <span class="category-label">Jardinagem</span>
        </button>
        <!-- Card especial: abre o menu lateral com todas as categorias -->
        <button class="category-item category-more-btn" id="open-categories-menu">
          <div class="category-icon-wrapper more-wrapper">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <rect x="3" y="3" width="8" height="8" rx="2" />
              <rect x="13" y="3" width="8" height="8" rx="2" />
              <rect x="3" y="13" width="8" height="8" rx="2" />
              <rect x="13" y="13" width="8" height="8" rx="2" />
            </svg>
          </div>
          <span class="category-label">Ver mais</span>
        </button>
      </section>

      <!-- Carrossel de promoções/banners (slides via JS, scroll com snap) -->
      <section class="banner-carousel">
        <div class="banner-track" id="banner-track">
          <!-- Slides injetados dinamicamente via JS -->
        </div>
        <div class="carousel-dots" id="banner-dots">
          <!-- Bolinhas injetadas dinamicamente via JS -->
        </div>
      </section>

      <!-- Seção "Perto de Você" (carrossel horizontal) -->
      <section class="section-nearby">
        <div class="section-header">
          <h2>Perto de Você</h2>
          <a href="#" class="see-all">Ver todos</a>
        </div>

        <div class="nearby-carousel" id="nearby-container">
          <!-- Injetado dinamicamente via JS -->
        </div>
      </section>

      <!-- Feed de publicações da comunidade -->
      <section class="feed-timeline">
        <h2>Publicações da Comunidade</h2>
        <div class="posts-list" id="posts-container">
          <!-- Injetado dinamicamente via JS -->
        </div>
      </section>

    </main>

    <div id="bottom-nav-root" data-active="home" data-context="app"></div>

    <div id="profile-drawer-root"></div>

    <!-- Drawer lateral de categorias, aberto pelo card "Ver mais" -->
    <div class="categories-drawer-overlay" id="categories-overlay"></div>

    <aside class="categories-drawer" id="categories-drawer">

      <div class="drawer-header-bar">
        <h2>Categorias</h2>
        <button class="close-drawer-btn" id="close-categories-drawer" aria-label="Fechar categorias">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0b2b3c" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>

      <div class="categories-drawer-scroll">

        <!-- Grade de categorias (exemplo genérico — substituir pela lista final depois) -->
        <section class="categories-grid-section">
          <h3 class="drawer-section-title">Todas as categorias</h3>

          <div class="categories-grid" id="categories-grid">
            <button class="grid-category-item" data-category="barbearia">
              <div class="grid-category-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/><line x1="12" y1="16" x2="12" y2="21"/></svg>
              </div>
              <span>Barbearia</span>
            </button>

            <button class="grid-category-item" data-category="confeitaria">
              <div class="grid-category-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/></svg>
              </div>
              <span>Confeitaria</span>
            </button>

            <button class="grid-category-item" data-category="mecanica">
              <div class="grid-category-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
              </div>
              <span>Mecânica</span>
            </button>

            <button class="grid-category-item" data-category="estetica">
              <div class="grid-category-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
              </div>
              <span>Estética</span>
            </button>

            <button class="grid-category-item" data-category="jardinagem">
              <div class="grid-category-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22v-9"/><path d="M12 13C7.5 13 4 9.5 4 5c4.5 0 8 3.5 8 8z"/><path d="M12 13c4.5 0 8-3.5 8-8-4.5 0-8 3.5-8 8z"/></svg>
              </div>
              <span>Jardinagem</span>
            </button>

            <!-- Exemplos genéricos abaixo — trocar pelo ícone/nome definitivo quando a lista fechar -->
            <button class="grid-category-item" data-category="eletricista">
              <div class="grid-category-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
              </div>
              <span>Eletricista</span>
            </button>

            <button class="grid-category-item" data-category="encanador">
              <div class="grid-category-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h9a3 3 0 0 1 3 3v0a3 3 0 0 1-3 3H9a3 3 0 0 0-3 3v0a3 3 0 0 0 3 3h11"/></svg>
              </div>
              <span>Encanador</span>
            </button>

            <button class="grid-category-item" data-category="pintura">
              <div class="grid-category-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3z"/><path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"/></svg>
              </div>
              <span>Pintura</span>
            </button>

            <button class="grid-category-item" data-category="limpeza">
              <div class="grid-category-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 5h-9L9 3H4a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z"/><path d="M4 10v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9"/></svg>
              </div>
              <span>Limpeza</span>
            </button>

            <button class="grid-category-item" data-category="petshop">
              <div class="grid-category-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="15" r="4"/><circle cx="5" cy="7" r="2"/><circle cx="19" cy="7" r="2"/><circle cx="9" cy="4" r="2"/><circle cx="15" cy="4" r="2"/></svg>
              </div>
              <span>Pet Shop</span>
            </button>

            <button class="grid-category-item" data-category="informatica">
              <div class="grid-category-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
              </div>
              <span>Informática</span>
            </button>

            <button class="grid-category-item" data-category="aulas">
              <div class="grid-category-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1.66 3 3 6 3s6-1.34 6-3v-5"/></svg>
              </div>
              <span>Aulas particulares</span>
            </button>
          </div>
        </section>
      </div>
    </aside>

  </div>

  <!-- Componentes compartilhados (header, bottom-nav, drawer de perfil) -->
  <script src="../../js/components/header-actions.js"></script>
  <script src="../../js/components/profile-drawer.js"></script>
  <script src="../../js/components/bottom-nav.js"></script>
  <!-- Lógica específica desta página -->
  <script src="../../js/pages/home.js"></script>
</body>
</html>
