<!-- Tela de Perfil perfil.html/profile.css/profile.js-->

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FazTchê - Perfil Profissional</title>
  <!-- 1 - CSS Base / Reset -->
  <link rel="stylesheet" href="../../css/base/reset.css">
  <link rel="stylesheet" href="../../css/base/tokens.css">
  
  <!-- 2 - CSS Layout & Responsividade -->
  <link rel="stylesheet" href="../../css/layouts/screen.css">
  
  <!-- 3 - CSS Componentes -->
  <link rel="stylesheet" href="../../css/components/buttons.css">
  <link rel="stylesheet" href="../../css/components/bottom-nav.css">
  <link rel="stylesheet" href="../../css/components/forms.css">
  <link rel="stylesheet" href="../../css/components/social-buttons.css">
  <link rel="stylesheet" href="../../css/components/divider.css">
  
  <!-- 4 - CSS da Página (Estrutura Unificada de Autenticação) -->
  <link rel="stylesheet" href="../../css/pages/profile.css">
</head>
<body>

    <!-- =========================================================
         1. HEADER (saudação, localização, logo, busca e perfil)
    ========================================================== -->
    <header class="home-header">

      <!-- 1.1 Linha superior: saudação/localização, logo central e ações -->
      <div class="header-top">

        <!-- 1.1.1 Saudação + localização atual -->
        <div class="user-location">
          <span class="greeting">Boa Noite, Murilo</span>
          <div class="location-tag">
            <svg width="12" height="14" viewBox="0 0 24 24" fill="var(--color-primary)"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            <small>Cachoeirinha</small>
          </div>
        </div>

        <!-- 1.1.2 Logo central (também funciona como botão de recarregar a Início) -->
        <a href="home.html" class="brand-logo" aria-label="Recarregar página inicial">
          <span class="brand-faz">Faz</span><span class="brand-tche">Tchê</span>
        </a>

        <!-- 1.1.3 Ações à direita: notificações e avatar (abre o drawer de perfil) -->
        <div class="header-actions">
          <button class="icon-btn" aria-label="Notificações">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>

          <button class="profile-avatar-btn" id="open-profile-drawer" aria-label="Abrir opções do perfil">
            <img src="../../assets/images/avatar_placeholder.png" alt="Perfil" class="user-avatar">
          </button>
        </div>
      </div>

  <div class="screen profile-screen">
    
    <!-- BANNER E NAVEGAÇÃO -->
    <div class="profile-header">
      <img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=800&q=80" alt="Capa Barbearia MK" class="cover-image">
      <div class="header-overlay"></div>
      
      <a href="javascript:history.back()" class="nav-btn back-btn" aria-label="Voltar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>

      <button class="nav-btn share-btn" aria-label="Compartilhar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
    </div>

    <!-- CONTEÚDO DO PERFIL -->
    <main class="profile-body">
      
      <!-- AVATAR COM SELO VERIFICADO -->
      <div class="avatar-wrapper">
        <div class="avatar">
          <span>MK</span>
        </div>
        <div class="verified-badge" title="Verificado">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
      </div>

      <!-- INFORMAÇÕES PRINCIPAIS -->
      <section class="profile-info">
        <div class="title-row">
          <h2>Barbearia MK</h2>
          <span class="badge-text">Verificado</span>
        </div>

        <p class="meta-info">Barbearia • Canoas, RS • <span class="status-open">Aberto agora</span></p>

        <div class="rating-row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#f59e0b"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          <strong class="rating-score">4,9</strong>
          <span class="rating-count">(128 avaliações)</span>
        </div>

        <p class="description">
          Especialistas em cortes, barba e cuidados masculinos. Atendimento de qualidade com agendamento e sem fila.
        </p>
      </section>

      <!-- GALERIA DE FOTOS -->
      <section class="gallery-section">
        <div class="gallery-grid">
          <img src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=300&q=80" alt="Trabalho 1">
          <img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=300&q=80" alt="Trabalho 2">
          <img src="https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=300&q=80" alt="Trabalho 3">
        </div>
      </section>

      <!-- BOTÕES DE AÇÃO FIXOS/DE DESTAQUE -->
      <section class="action-buttons">
        <button type="button" id="btn-request-quote" class="btn btn-primary">Pedir orçamento</button>
        <button type="button" id="btn-whatsapp" class="btn btn-outline-whatsapp">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984a9.964 9.964 0 001.333 4.993L2 22l5.233-1.237a9.982 9.982 0 004.779 1.217h.004c5.505 0 9.988-4.478 9.989-9.985 0-2.669-1.038-5.176-2.925-7.062A9.925 9.925 0 0012.012 2z"/></svg>
          Chamar no WhatsApp
        </button>
      </section>
    
    </main>

  </div>
    <!-- =========================================================
         6. BOTTOM NAV (menu inferior fixo)
    ========================================================== -->
    <nav class="bottom-nav">
      <a href="../app/home.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Início</span>
      </a>
      <a href="../app/search.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <span>Buscar</span>
      </a>
      <a href="../app/publish.html" class="nav-item publish-btn">
        <div class="plus-circle">+</div>
        <span>Publicar</span>
      </a>
      <a href="../app/explore.html" class="nav-item">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M16.24 7.76l-2.12 6.36-6.36 2.12 2.12-6.36z"/></svg>
        <span>Explorar</span>
      </a>
      <a href="../profile/profile.html" class="nav-item active">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Perfil</span>
      </a>

  <script src="../../js/profile.js"></script>
</body>
</html>
