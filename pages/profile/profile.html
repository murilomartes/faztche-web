<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FazTchê - Perfil Profissional</title>

  <link rel="stylesheet" href="../../css/base/reset.css">
  <link rel="stylesheet" href="../../css/base/tokens.css">
  <link rel="stylesheet" href="../../css/layouts/screen.css">
  <link rel="stylesheet" href="../../css/components/buttons.css">
  <link rel="stylesheet" href="../../css/components/bottom-nav.css">
  <link rel="stylesheet" href="../../css/components/forms.css">
  <link rel="stylesheet" href="../../css/components/social-buttons.css">
  <link rel="stylesheet" href="../../css/components/divider.css">
  <link rel="stylesheet" href="../../css/pages/profile.css">
</head>
<body>

  <div class="screen profile-screen">

    <!-- Banner de capa + navegação (voltar/compartilhar) -->
    <div class="profile-header">
      <img src="https://images.unsplash.com/photo-1503951914875-452162b0f3f1?auto=format&fit=crop&w=800&q=80" alt="Capa Barbearia MK" class="cover-image">
      <div class="header-overlay"></div>
      
      <a href="javascript:history.back()" class="nav-btn back-btn" aria-label="Voltar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      </a>

      <button class="nav-btn share-btn" aria-label="Compartilhar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      </button>
    </div>

    <!-- Conteúdo do perfil -->
    <main class="profile-body">
      
      <!-- Avatar com selo verificado -->
      <div class="avatar-wrapper">
        <div class="avatar">
          <span>MK</span>
        </div>
        <div class="verified-badge" title="Verificado">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
      </div>

      <!-- Informações principais -->
      <section class="profile-info">
        <div class="title-row">
          <h2>Barbearia MK</h2>
          <span class="badge-text">Verificado</span>
        </div>

        <p class="meta-info">Barbearia • Canoas, RS • <span class="status-open">Aberto agora</span></p>

        <div class="rating-row">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#f59e0b"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
          <strong class="rating-score">4,9</strong>
          <span class="rating-count">(128 avaliações)</span>
        </div>

        <p class="description">
          Especialistas em cortes, barba e cuidados masculinos. Atendimento de qualidade com agendamento e sem fila.
        </p>
      </section>

      <!-- Galeria de fotos -->
      <section class="gallery-section">
        <div class="gallery-grid">
          <img src="https://images.unsplash.com/photo-1585747860715-2ba37e788b70?auto=format&fit=crop&w=300&q=80" alt="Trabalho 1">
          <img src="https://images.unsplash.com/photo-1621605815971-fbc98d665033?auto=format&fit=crop&w=300&q=80" alt="Trabalho 2">
          <img src="https://images.unsplash.com/photo-1599351431202-1e0f0137899a?auto=format&fit=crop&w=300&q=80" alt="Trabalho 3">
        </div>
      </section>

      <!-- Botões de ação fixos/de destaque -->
      <section class="action-buttons">
        <button type="button" id="btn-request-quote" class="btn btn-primary">Pedir orçamento</button>
        <button type="button" id="btn-whatsapp" class="btn btn-outline-whatsapp">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12.012 2c-5.506 0-9.989 4.478-9.99 9.984a9.964 9.964 0 001.333 4.993L2 22l5.233-1.237a9.982 9.982 0 004.779 1.217h.004c5.505 0 9.988-4.478 9.989-9.985 0-2.669-1.038-5.176-2.925-7.062A9.925 9.925 0 0012.012 2z"/></svg>
          Chamar no WhatsApp
        </button>
      </section>

    </main>

    <div id="bottom-nav-root" data-active="profile" data-context="profile"></div>

  </div>

  <script src="../../js/components/bottom-nav.js"></script>
</body>
</html>
