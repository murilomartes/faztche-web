<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/styles.css">
<title>FazTchê - Cadastro</title>
</head>
<body>

  <div class="screen">
    <div class="signup-photo">
      <svg class="curve" viewBox="0 0 500 56" preserveAspectRatio="none">
        <path d="M0,56 L0,28 C120,-8 350,46 500,10 L500,56 Z" fill="#ffffff"></path>
      </svg>
    </div>

    <div class="signup-content">

      <div class="signup-logo">
        <img src="assets/logo.png" alt="">
        <span>Faz<strong>Tchê</strong></span>
      </div>

      <p class="account-subtitle">Cadastre sua conta</p>

      <form class="account-form">
        <input class="field" type="email" name="email" placeholder="E-mail" required>
        <input class="field" type="password" name="senha" placeholder="Senha" required>
        <input class="field" type="password" name="confirmar_senha" placeholder="Confirme a Senha" required>

        <button class="btn btn-dark" type="submit">Entrar</button>
      </form>

      <div class="social-login">
        <button type="button" class="social-btn google" aria-label="Entrar com Google">
          <svg viewBox="0 0 24 24">
            <path fill="#4285F4" d="M23.52 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.47c-.28 1.5-1.13 2.77-2.4 3.62v3h3.88c2.27-2.09 3.57-5.17 3.57-8.81z"/>
            <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.95-2.92l-3.88-3c-1.08.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.95H1.27v3.1C3.25 21.3 7.31 24 12 24z"/>
            <path fill="#FBBC05" d="M5.27 14.28A7.2 7.2 0 0 1 4.9 12c0-.79.14-1.56.37-2.28v-3.1H1.27A11.98 11.98 0 0 0 0 12c0 1.94.46 3.77 1.27 5.38l4-3.1z"/>
            <path fill="#EA4335" d="M12 4.77c1.77 0 3.35.61 4.6 1.8l3.44-3.44C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.62l4 3.1C6.22 6.88 8.87 4.77 12 4.77z"/>
          </svg>
        </button>

        <button type="button" class="social-btn instagram" aria-label="Entrar com Instagram">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8">
            <rect x="3" y="3" width="18" height="18" rx="5"/>
            <circle cx="12" cy="12" r="4.2"/>
            <circle cx="17.4" cy="6.6" r="1" fill="#fff" stroke="none"/>
          </svg>
        </button>

        <button type="button" class="social-btn x" aria-label="Entrar com X">
          <svg viewBox="0 0 24 24" fill="#fff">
            <path d="M18.9 3H21.7l-6.2 7.1L22.8 21h-5.6l-4.4-5.8L7.7 21H4.9l6.6-7.6L4 3h5.7l4 5.3L18.9 3Zm-1 16.2h1.5L7.2 4.7H5.6l12.3 14.5Z"/>
          </svg>
        </button>
      </div>

    </div>

  </div>

</body>
</html>


</body>
</html>
