<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FazTchê — Criar conta</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <div class="screen">

    <header class="account-header">
      <a href="index.html" class="back-button"><img src="assets/seta.png" alt=""></a>
      <h1>Criar conta</h1>
    </header>

    <main class="account-content">

<label class="card account-option">
  <input type="radio" name="tipo-conta" value="cliente" checked />

    <img src="assets/cliente.png" alt="" class="account-icon">

    <div class="account-text">
      <strong>Cliente</strong>
      <p>Encontre serviçoss, comércio e ofertas.</p>
    </div>
  </label>

      <label class="card account-option">
        <input type="radio" name="tipo-conta" value="profissional" />

          <img src="assets/icon_profissional.png" alt="" class="account-icon">

        <div>
          <strong>Profissional</strong>
          <p>Ofereça seus serviços e conquiste clientes.</p>
        </div>
      </label>

      <label class="card account-option">
        <input type="radio" name="tipo-conta" value="empresa" />

        <img src="assets/empresa.png" alt="" class="account-icon">

        <div>
          <strong>Empresa</strong>
          <p>Divulgue sua empresa e aumente as vendas.</p>
        </div>
      </label>

      <form class="account-form">

        <input
          class="field"
          type="text"
          placeholder="Nome"
          required
        />

        <input
          class="field"
          type="email"
          placeholder="E-mail"
          required
        />

        <input
          class="field"
          type="password"
          placeholder="Senha"
          required
        />

        <label class="terms">
          <input type="checkbox" required />
          <span>
            Li e aceito os Termos de Uso e a Política de Privacidade.
          </span>
        </label>

        <button type="submit" class="btn btn-primary">
          Criar conta
        </button>

      </form>

    </main>

  </div>

</body>
</html>
